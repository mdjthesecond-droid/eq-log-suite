# Copy this to local.yaml (gitignored) and fill in your real password.
database:
  host: localhost
  port: 3306
  user: eqlogs
  password: "CHANGE_ME"
  name: eqlogs

# Folders the tailer auto-scans for new/rotated log files (new character or
# new server). Scanned once at startup and every few minutes while the
# tailer runs -- see eq_log_suite/discovery.py.
log_roots:
  eql: /home/myself/eql/Logs
  eq: /home/myself/eq/Logs
